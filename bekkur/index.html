<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ganga í bekk – Málstöðin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(to bottom, #f8f7f4 0%, #e8e6e1 100%);
      min-height: 100vh;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.35s ease both; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

  <div id="loading" class="text-center">
    <div class="text-4xl mb-4">🏫</div>
    <p class="text-gray-500 font-light">Hleður...</p>
  </div>

  <div id="app" style="display:none" class="w-full max-w-sm fade-in"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import {
      getAuth, onAuthStateChanged,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      signInWithPopup, GoogleAuthProvider, signOut
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDhmWC3YG-eJqTQgTj3otO7tLdo1Zjzh-4",
      authDomain: "malstodin-90f85.firebaseapp.com",
      projectId: "malstodin-90f85",
      storageBucket: "malstodin-90f85.firebasestorage.app",
      messagingSenderId: "190485777754",
      appId: "1:190485777754:web:070d4a35eaa9d65e8b3763"
    };

    const COURSE_LABEL = {
      isat1ia: 'ÍSAT1ÍA – Fólkið í hverfinu',
      isat1ic: 'ÍSAT1ÍC – Út og suður',
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    let joinCode = (new URLSearchParams(window.location.search).get('kodi') || '')
      .toUpperCase().replace(/[^A-Z0-9]/g, '');

    // ── Hjálparföll ───────────────────────────────────────────────
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

    async function joinApi(action, user) {
      const idToken = await user.getIdToken();
      let res;
      try {
        res = await fetch('/.netlify/functions/join-class', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
          body: JSON.stringify({ action, code: joinCode })
        });
      } catch {
        throw new Error('Tenging mistókst. Reyndu aftur.');
      }
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || 'Villa kom upp. Reyndu aftur.');
      return json;
    }

    function show(html) {
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('app');
      el.style.display = 'block';
      el.innerHTML = html;
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      if (el) el.textContent = msg;
    }

    const header = (emoji) => `
      <div class="text-center mb-6">
        <div class="text-5xl mb-3">${emoji}</div>
        <h1 class="text-2xl font-light text-gray-800">Málstöðin</h1>
        <p class="text-gray-500 text-sm font-light mt-1">Ganga í bekk</p>
      </div>`;

    const whoAmI = (user) => `
      <div class="bg-gray-50 rounded-lg px-4 py-2 mb-5 text-center">
        <p class="text-xs text-gray-400 font-light">Innskráð/ur sem</p>
        <p class="text-sm text-gray-700 font-light">${esc(user.email)}</p>
      </div>`;

    const logoutBtn = `
      <button id="btn-logout"
        class="w-full text-center text-sm text-gray-400 hover:text-gray-600 font-light transition-colors">
        Skrá út
      </button>`;

    function bindLogout() {
      const btn = document.getElementById('btn-logout');
      if (btn) btn.onclick = () => signOut(auth);
    }

    // ── Innskráning ───────────────────────────────────────────────
    function renderLogin(errorMsg = '') {
      show(`
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 fade-in">
          ${header('🏫')}
          <p class="text-sm font-light text-gray-500 mb-5 text-center">
            Skráðu þig inn til að ganga í bekkinn hjá kennaranum þínum.
          </p>
          <div id="err" class="mb-4 text-red-600 text-sm font-light text-center">${esc(errorMsg)}</div>

          <button id="btn-google"
            class="w-full flex items-center justify-center gap-3 px-4 py-3 border-2 border-gray-200
                   rounded-lg hover:bg-gray-50 transition-colors font-light text-gray-700 mb-4">
            <svg class="w-5 h-5" viewBox="0 0 48 48">
              <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.4-4z"/>
              <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
              <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.5 35.6 26.9 36 24 36c-5.3 0-9.5-2.9-11.3-7.1l-6.6 4.9C9.7 39.7 16.3 44 24 44z"/>
              <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.5-2.6 4.6-4.8 6l6.2 5.2C40.3 35.7 44 30.3 44 24c0-1.3-.1-2.7-.4-4z"/>
            </svg>
            Skrá inn með Google
          </button>

          <div class="relative mb-4">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
            <div class="relative flex justify-center">
              <span class="bg-white px-3 text-xs text-gray-400 font-light">eða með tölvupósti</span>
            </div>
          </div>

          <input id="email" type="email" placeholder="Netfang"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none
                   focus:ring-2 focus:ring-blue-500 font-light mb-3 text-sm" />
          <input id="pw" type="password" placeholder="Lykilorð"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none
                   focus:ring-2 focus:ring-blue-500 font-light mb-4 text-sm" />
          <button id="btn-login"
            class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700
                   transition-colors font-light">
            Áfram →
          </button>
          <p class="text-center text-xs text-gray-400 font-light mt-3">
            Nýr notandi? Við búum til reikning fyrir þig sjálfkrafa.
          </p>
        </div>
      `);

      document.getElementById('btn-google').onclick = async () => {
        showError('err', '');
        try { await signInWithPopup(auth, new GoogleAuthProvider()); }
        catch { showError('err', 'Villa við Google-innskráningu.'); }
      };

      document.getElementById('btn-login').onclick = async () => {
        const email = document.getElementById('email').value.trim();
        const pw    = document.getElementById('pw').value;
        showError('err', '');
        if (!email || !pw) { showError('err', 'Fylltu inn netfang og lykilorð.'); return; }
        if (pw.length < 6) { showError('err', 'Lykilorð verður að vera að minnsta kosti 6 stafir.'); return; }
        const btn = document.getElementById('btn-login');
        btn.textContent = 'Augnablik...';
        btn.disabled = true;
        try {
          try {
            await signInWithEmailAndPassword(auth, email, pw);
          } catch (e) {
            if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
              await createUserWithEmailAndPassword(auth, email, pw);
            } else {
              throw e;
            }
          }
        } catch (e) {
          if (e.code === 'auth/wrong-password') showError('err', 'Rangt lykilorð.');
          else if (e.code === 'auth/invalid-email') showError('err', 'Ógilt netfang.');
          else showError('err', 'Villa við innskráningu.');
          btn.textContent = 'Áfram →';
          btn.disabled = false;
        }
      };
    }

    // ── Slá inn kóða (ef hann fylgdi ekki hlekknum) ───────────────
    function renderEnterCode(user, errorMsg = '') {
      show(`
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 fade-in">
          ${header('🏫')}
          <p class="text-sm font-light text-gray-500 mb-5 text-center">
            Sláðu inn bekkjarkóðann frá kennaranum þínum.
          </p>
          ${whoAmI(user)}
          <div id="err" class="mb-3 text-red-600 text-sm font-light text-center">${esc(errorMsg)}</div>
          <input id="code" type="text" placeholder="T.d. K7QM4P" maxlength="8" value="${esc(joinCode)}"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none
                   focus:ring-2 focus:ring-blue-500 font-light mb-4 text-center text-lg tracking-widest uppercase" />
          <button id="btn-next"
            class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700
                   transition-colors font-light mb-3">
            Áfram →
          </button>
          ${logoutBtn}
        </div>
      `);
      bindLogout();
      document.getElementById('btn-next').onclick = () => {
        joinCode = document.getElementById('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!joinCode) { showError('err', 'Sláðu inn kóða.'); return; }
        peek(user);
      };
    }

    // ── Staðfesta bekk ────────────────────────────────────────────
    async function peek(user) {
      show(`<div class="text-center"><p class="text-gray-500 font-light">Sæki bekk...</p></div>`);
      let info;
      try { info = await joinApi('peek', user); }
      catch (e) { renderEnterCode(user, e.message); return; }
      if (info.alreadyMember) { renderDone(info, true); return; }

      show(`
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 fade-in">
          ${header('🏫')}
          ${whoAmI(user)}
          <div class="border border-blue-100 bg-blue-50 rounded-xl px-5 py-4 mb-5 text-center">
            <p class="text-xs text-blue-600 font-light mb-1">${esc(COURSE_LABEL[info.course] || info.course)}</p>
            <p class="text-lg text-gray-800 font-light">${esc(info.className)}</p>
            ${info.teacherName ? `<p class="text-sm text-gray-500 font-light mt-1">Kennari: ${esc(info.teacherName)}</p>` : ''}
          </div>
          <p class="text-sm font-light text-gray-500 mb-5 text-center">
            Kennarinn sér framvindu þína í æfingunum þegar þú gengur í bekkinn.
          </p>
          <div id="err" class="mb-3 text-red-600 text-sm font-light text-center"></div>
          <button id="btn-join"
            class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700
                   transition-colors font-light mb-3">
            Ganga í bekkinn →
          </button>
          ${logoutBtn}
        </div>
      `);
      bindLogout();
      document.getElementById('btn-join').onclick = async () => {
        const btn = document.getElementById('btn-join');
        btn.textContent = 'Augnablik...';
        btn.disabled = true;
        try {
          renderDone(await joinApi('join', user), false);
        } catch (e) {
          showError('err', e.message);
          btn.textContent = 'Ganga í bekkinn →';
          btn.disabled = false;
        }
      };
    }

    // ── Lokið ─────────────────────────────────────────────────────
    function renderDone(info, already) {
      const course = info.course;
      const next = info.hasAccess
        ? `<button onclick="window.location.href='/${course}/'"
             class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700
                    transition-colors font-light">
             Fara á námskeiðið →
           </button>`
        : `<div class="bg-amber-50 border border-amber-200 rounded-lg px-4 py-3 mb-4 text-left">
             <p class="text-sm text-gray-700 font-light"><strong class="font-medium">Næsta skref:</strong>
               virkjaðu aðgangskóðann sem fylgir bókinni.</p>
           </div>
           <button onclick="window.location.href='/${course}/login.html'"
             class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700
                    transition-colors font-light">
             Virkja kóða úr bók →
           </button>`;

      show(`
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center fade-in">
          <div class="text-5xl mb-4">${already ? '👋' : '🎉'}</div>
          <h1 class="text-xl font-light text-gray-800 mb-2">
            ${already ? 'Þú ert nú þegar í bekknum' : 'Þú ert komin/n í bekkinn!'}
          </h1>
          <p class="text-gray-500 text-sm font-light mb-6">
            ${esc(info.className)} · ${esc(COURSE_LABEL[course] || course)}
          </p>
          ${next}
        </div>
      `);
    }

    // ── Auth ástand ───────────────────────────────────────────────
    onAuthStateChanged(auth, (user) => {
      if (!user) { renderLogin(); return; }
      if (joinCode) peek(user);
      else renderEnterCode(user);
    });
  </script>
</body>
</html>
