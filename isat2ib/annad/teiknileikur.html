<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎨 Teiknileikur — Áfangastöð</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="gogn.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(to bottom, #f8f7f4 0%, #e8e6e1 100%);
    min-height: 100vh; margin: 0;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(12px);} to {opacity:1; transform:none;} }
  .fade-in { animation: fadeIn .4s ease both; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const SEKUNDUR = 60;

const App = () => {
  const lotaNr = parseInt(new URLSearchParams(location.search).get('lota')) || 1;
  const lota = window.AFANGASTODVAR[lotaNr];
  const ORD = lota ? lota.ord.filter(o => o.teikn) : [];

  const [notud, setNotud] = useState([]);
  const [ord, setOrd] = useState(null);
  const [timi, setTimi] = useState(SEKUNDUR);
  const [gengur, setGengur] = useState(false);
  const [bunid, setBunid] = useState(false);

  useEffect(() => {
    let t;
    if (gengur && timi > 0) t = setInterval(() => setTimi(p => p - 1), 1000);
    else if (timi === 0) setGengur(false);
    return () => clearInterval(t);
  }, [gengur, timi]);

  if (!lota) return (
    <Skel lotaNr={lotaNr} titill="—">
      <p className="text-gray-600 font-light text-center py-16">Áfangastöð {lotaNr} er ekki tilbúin enn.</p>
    </Skel>
  );

  const naOrdi = (nuNotud) => {
    const laus = ORD.filter(o => !nuNotud.includes(o.is));
    if (laus.length === 0) { setBunid(true); return null; }
    return laus[Math.floor(Math.random() * laus.length)];
  };

  const byrja = () => {
    const o = naOrdi(notud);
    if (o) { setOrd(o); setTimi(SEKUNDUR); setGengur(true); }
  };

  const naest = () => {
    const nyNotud = ord ? [...notud, ord.is] : [...notud];
    setNotud(nyNotud);
    const o = naOrdi(nyNotud);
    if (o) { setOrd(o); setTimi(SEKUNDUR); setGengur(true); }
    else { setOrd(null); setGengur(false); }
  };

  const stoppa = () => { setGengur(false); setTimi(SEKUNDUR); setOrd(null); };

  const endurstilla = () => {
    setNotud([]); setOrd(null); setTimi(SEKUNDUR); setGengur(false); setBunid(false);
  };

  const timaTexti = s => Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);

  return (
    <Skel lotaNr={lotaNr} titill={lota.titill}>
      {/* Leiðbeiningar */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
        <h2 className="text-lg font-medium text-gray-800 mb-3">Svona er leikið</h2>
        <ul className="space-y-1.5 text-gray-600 font-light text-sm">
          <li>Einn nemandi les orðið og teiknar það á töfluna eða blað.</li>
          <li>Sá sem teiknar má ekki tala og ekki skrifa stafi.</li>
          <li>Hinir giska á íslensku.</li>
          <li>Þið hafið eina mínútu. Ýtið á „Næsta orð" þegar rétt er giskað.</li>
        </ul>
      </div>

      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
        <p className="text-center text-sm text-gray-500 font-light mb-6">
          Orð notuð: <span className="font-medium text-gray-700">{notud.length}</span> af {ORD.length}
        </p>

        {bunid && (
          <div className="text-center py-10 fade-in">
            <div className="text-5xl mb-4">🎉</div>
            <h2 className="text-2xl font-light text-gray-800 mb-2">Leik lokið</h2>
            <p className="text-gray-500 font-light mb-6">Þið kláruðuð öll {ORD.length} orðin.</p>
            <button onClick={endurstilla}
              className="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-light">
              Byrja aftur
            </button>
          </div>
        )}

        {!bunid && !ord && (
          <div className="text-center py-10 fade-in">
            <div className="text-5xl mb-6">🎨</div>
            <button onClick={byrja}
              className="px-8 py-4 bg-green-600 text-white rounded-lg text-lg hover:bg-green-700 transition-colors font-light shadow-sm">
              Birta orð
            </button>
          </div>
        )}

        {!bunid && ord && (
          <div className="text-center fade-in">
            <div className="flex justify-center gap-2 mb-4">
              <span className="px-3 py-1 rounded-xl text-xs border bg-purple-50 text-purple-700 border-purple-200 font-light">
                kafli {ord.kafli}
              </span>
              <span className="px-3 py-1 rounded-xl text-xs border bg-gray-100 text-gray-600 border-gray-200 font-light">
                {ord.persona}
              </span>
            </div>

            <div className="bg-gray-50 border-2 border-gray-200 rounded-xl py-12 px-6 mb-8">
              <p className="text-5xl font-light text-gray-800 break-words">{ord.is}</p>
            </div>

            <div className={`text-5xl font-light mb-8 ${timi <= 10 ? 'text-red-600' : 'text-gray-700'}`}>
              {timaTexti(timi)}
            </div>

            <div className="flex flex-col sm:flex-row gap-3 justify-center">
              <button onClick={stoppa}
                className="px-6 py-3 border-2 border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 transition-colors font-light text-sm">
                Stoppa
              </button>
              <button onClick={naest}
                className="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-light">
                Næsta orð →
              </button>
            </div>
          </div>
        )}
      </div>

      {notud.length > 0 && !bunid && (
        <div className="mt-6 bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h3 className="text-sm font-medium text-gray-700 mb-3">Orð sem búið er að teikna</h3>
          <div className="flex flex-wrap gap-2">
            {notud.map((w, i) => (
              <span key={i} className="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-sm font-light">{w}</span>
            ))}
          </div>
        </div>
      )}
    </Skel>
  );
};

const Skel = ({ lotaNr, titill, children }) => (
  <div className="min-h-screen pb-16">
    <header className="bg-white shadow-sm border-b border-gray-200">
      <div className="max-w-4xl mx-auto px-6 py-8">
        <button onClick={() => window.history.back()}
          className="text-sm text-gray-500 hover:text-gray-700 mb-2 inline-block font-light">← Til baka</button>
        <h1 className="text-3xl font-light text-gray-800 mb-2">🎨 Teiknileikur</h1>
        <p className="text-gray-500 text-sm font-light">Áfangastöð {lotaNr} · {titill} · bekkjarleikur</p>
      </div>
    </header>
    <main className="max-w-4xl mx-auto px-6 mt-8">{children}</main>
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
