<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎧 Orðagáta — Áfangastöð</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="gogn.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(to bottom, #f8f7f4 0%, #e8e6e1 100%);
    min-height: 100vh; margin: 0;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(12px);} to {opacity:1; transform:none;} }
  .fade-in { animation: fadeIn .4s ease both; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const UMFERDIR = 15;   // fjöldi gátna í einni lotu

async function playAudio(text, onEnd) {
  try {
    const r = await fetch('/.netlify/functions/speak', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text_to_speak: text })
    });
    const data = await r.json();
    if (!r.ok || data.error || !data.audio_base64) { onEnd && onEnd(); return; }
    const audio = new Audio(`data:audio/mp3;base64,${data.audio_base64}`);
    audio.onended = () => onEnd && onEnd();
    audio.onerror = () => onEnd && onEnd();
    await audio.play().catch(() => onEnd && onEnd());
    return audio;
  } catch (e) { console.error(e); onEnd && onEnd(); }
}

const stokka = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const ListenPill = ({ onClick, speaking, label }) => (
  <button onClick={onClick}
    className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-xl text-sm border transition-all ${speaking
      ? 'bg-green-50 text-green-700 border-green-200'
      : 'bg-gray-100 text-gray-600 border-gray-200 hover:bg-gray-200'}`}>
    <span className="opacity-70">🎧</span>
    <span className="font-light">{label || 'Hlustaðu aftur'}</span>
    <span className={`text-green-600 ${speaking ? 'animate-pulse' : ''}`}>🔊</span>
  </button>
);

const ProgressBar = ({ current, total }) => (
  <div className="flex items-center gap-3 mb-6">
    {Array.from({ length: total }).map((_, i) => (
      <div key={i} className={`h-1.5 flex-1 rounded-full transition-all duration-500 ${
        i < current ? 'bg-green-500' : i === current ? 'bg-blue-400' : 'bg-gray-200'}`} />
    ))}
    <span className="text-xs text-gray-400 font-light whitespace-nowrap">{current}/{total}</span>
  </div>
);

const App = () => {
  const lotaNr = parseInt(new URLSearchParams(location.search).get('lota')) || 1;
  const lota = window.AFANGASTODVAR[lotaNr];

  const [gatur, setGatur] = useState([]);
  const [idx, setIdx] = useState(0);
  const [valid, setValid] = useState(null);
  const [stig, setStig] = useState(0);
  const [speaking, setSpeaking] = useState(false);
  const [bunid, setBunid] = useState(false);
  const [saga, setSaga] = useState([]);      // { ord, rett }
  const lesid = useRef(-1);

  /* Byggja gátulistann: 15 orð, hvert með 3 afvegaleiðendum úr sömu lotu */
  const byggja = () => {
    const oll = lota.ord;
    const valin = stokka(oll).slice(0, Math.min(UMFERDIR, oll.length));
    return valin.map(o => {
      const rangir = stokka(oll.filter(x => x.is !== o.is)).slice(0, 3);
      return { ord: o, valkostir: stokka([o, ...rangir]) };
    });
  };

  useEffect(() => { if (lota) setGatur(byggja()); }, []);

  const gata = gatur[idx];

  /* Lesa vísbendinguna sjálfkrafa þegar ný gáta birtist */
  useEffect(() => {
    if (!gata || lesid.current === idx) return;
    lesid.current = idx;
    setSpeaking(true);
    playAudio(gata.ord.visbending, () => setSpeaking(false));
  }, [gata, idx]);

  if (!lota) return (
    <Skel lotaNr={lotaNr} titill="—">
      <p className="text-gray-600 font-light text-center py-16">Áfangastöð {lotaNr} er ekki tilbúin enn.</p>
    </Skel>
  );
  if (!gata && !bunid) return <Skel lotaNr={lotaNr} titill={lota.titill}><div className="py-16" /></Skel>;

  const segjaAftur = () => {
    if (speaking) return;
    setSpeaking(true);
    playAudio(gata.ord.visbending, () => setSpeaking(false));
  };

  const velja = (val) => {
    if (valid) return;
    const rett = val.is === gata.ord.is;
    setValid({ val, rett });
    if (rett) setStig(stig + 1);
    setSaga([...saga, { ord: gata.ord.is, rett }]);
  };

  const naest = () => {
    setValid(null);
    if (idx + 1 >= gatur.length) setBunid(true);
    else setIdx(idx + 1);
  };

  const aftur = () => {
    setGatur(byggja()); setIdx(0); setValid(null);
    setStig(0); setBunid(false); setSaga([]); lesid.current = -1;
  };

  if (bunid) {
    const rangar = saga.filter(s => !s.rett);
    return (
      <Skel lotaNr={lotaNr} titill={lota.titill}>
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-8 fade-in">
          <h2 className="text-2xl font-light text-gray-800 mb-2">Orðagátunni lokið</h2>
          <p className="text-gray-500 font-light mb-6">
            Þú fékkst <span className="font-medium text-green-700">{stig}</span> af {gatur.length} réttum.
          </p>
          {rangar.length > 0 && (
            <div className="mb-6">
              <h3 className="text-sm font-medium text-gray-700 mb-3">Orð til að æfa betur:</h3>
              <div className="flex flex-wrap gap-2">
                {rangar.map((r, i) => (
                  <span key={i} className="bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1 rounded-full text-sm font-light">{r.ord}</span>
                ))}
              </div>
            </div>
          )}
          <div className="flex flex-col sm:flex-row gap-3">
            <button onClick={aftur}
              className="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-light">
              Spila aftur
            </button>
            <button onClick={() => window.history.back()}
              className="px-6 py-3 border-2 border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 transition-colors font-light text-sm">
              Til baka á áfangastöðina
            </button>
          </div>
        </div>
      </Skel>
    );
  }

  return (
    <Skel lotaNr={lotaNr} titill={lota.titill}>
      <ProgressBar current={idx} total={gatur.length} />

      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-8 fade-in" key={idx}>
        <div className="text-center mb-8">
          <div className="text-5xl mb-4">{speaking ? '🔊' : '🎧'}</div>
          <p className="text-gray-500 font-light mb-4">Hlustaðu á vísbendinguna og veldu rétta orðið.</p>
          <ListenPill onClick={segjaAftur} speaking={speaking} />
        </div>

        <div className="grid gap-3">
          {gata.valkostir.map(v => {
            let cls = 'bg-white border-gray-200 text-gray-700 hover:bg-gray-50';
            if (valid) {
              if (v.is === gata.ord.is) cls = 'bg-green-50 border-green-200 text-green-700';
              else if (v.is === valid.val.is) cls = 'bg-red-50 border-red-200 text-red-700';
              else cls = 'bg-white border-gray-100 text-gray-400';
            }
            return (
              <button key={v.is} onClick={() => velja(v)} disabled={!!valid}
                className={`px-5 py-4 rounded-lg border-2 text-left font-light transition-colors ${cls}`}>
                {v.is}
              </button>
            );
          })}
        </div>

        {valid && (
          <div className={`mt-5 p-3 rounded-lg border fade-in ${valid.rett
            ? 'bg-green-50 border-green-200 text-green-700'
            : 'bg-amber-50 border-amber-200 text-amber-700'}`}>
            <p className="text-sm font-light">
              {valid.rett
                ? 'Rétt! ' + gata.ord.visbending
                : `Rétta svarið er „${gata.ord.is}". ${gata.ord.visbending}`}
            </p>
          </div>
        )}

        {valid && (
          <button onClick={naest}
            className="w-full mt-5 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-light">
            {idx + 1 >= gatur.length ? 'Sjá niðurstöðu →' : 'Næsta orð →'}
          </button>
        )}
      </div>
    </Skel>
  );
};

const Skel = ({ lotaNr, titill, children }) => (
  <div className="min-h-screen pb-16">
    <header className="bg-white shadow-sm border-b border-gray-200">
      <div className="max-w-2xl mx-auto px-6 py-8">
        <button onClick={() => window.history.back()}
          className="text-sm text-gray-500 hover:text-gray-700 mb-2 inline-block font-light">← Til baka</button>
        <h1 className="text-3xl font-light text-gray-800 mb-2">🎧 Orðagáta</h1>
        <p className="text-gray-500 text-sm font-light">Áfangastöð {lotaNr} · {titill}</p>
      </div>
    </header>
    <main className="max-w-2xl mx-auto px-6 mt-8">{children}</main>
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
